# Milpia: verifies the oidc-sso module against the self-hosted OIDC providers
# every week and on demand (spec 004, NFR-QA-003; Jira MIL-484).
# Okta and Auth0 are never run here: their credentials are not stored in GitHub.
name: Milpia OIDC providers

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  verify:
    # Never runs in upstream or in other forks that pull this file in.
    if: github.repository == 'Milpia/mlp-dokploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        provider: [keycloak, authentik, zitadel, fusionauth, authelia]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.4.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter=dokploy exec playwright-core install --with-deps chromium

      - name: Verify ${{ matrix.provider }}
        run: pnpm --filter=dokploy run e2e:oidc ${{ matrix.provider }}

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oidc-result-${{ matrix.provider }}
          path: specs/004-oidc-provider-compatibility/results/${{ matrix.provider }}.json
          if-no-files-found: warn

  report:
    # NFR-QA-003: a failed weekly run must be visible to the team. A manual run
    # is already watched by whoever started it.
    needs: verify
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Falló la verificación semanal de proveedores OIDC"
          body="La ejecución programada falló: $RUN_URL"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
