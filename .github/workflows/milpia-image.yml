# Milpia: publishes the fork's image to GHCR on every merge to canary
# (infra spec 014, contracts/imagen.md I1-I8; Jira MIL-425).
name: Milpia image (GHCR)

on:
  push:
    branches: [canary]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: milpia-image-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/milpia/mlp-dokploy

jobs:
  image:
    # Never runs in upstream or in other forks that pull this file in.
    if: github.repository == 'Milpia/mlp-dokploy'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read upstream version
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/dokploy/package.json').version")
          echo "upstream=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.milpia.dokploy.upstream=${{ steps.meta.outputs.upstream }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          UPSTREAM: ${{ steps.meta.outputs.upstream }}
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo '```'
            echo "${IMAGE_NAME}:${GITHUB_SHA}@${DIGEST}"
            echo '```'
            echo
            echo "Upstream: \`${UPSTREAM}\`"
          } >> "$GITHUB_STEP_SUMMARY"
