    - T017
    - T020
    bugs: []
    status: planned
  FR-007:
    text: La interfaz MUST ocultar las acciones de gestión de usuarios a quien no tiene el permiso, sin ocultarle
      la lista de usuarios. Si el admin pertenece al grupo de gestión pero su permiso caducó (FR-015), la sección
      de usuarios MUST mostrarle un aviso que le indique que vuelva a iniciar sesión por SSO para recuperarlo.
    tasks:
    - MIL-448
    - MIL-449
    local_tasks:
    - T018
    - T019
    - T031
    bugs: []
    status: planned
  FR-008:
    text: El sistema MUST recalcular la pertenencia al grupo de gestión de usuarios en cada login por SSO, igual
      que el rol (spec 001, FR-008a).
    tasks:
    - MIL-440
    - MIL-443
    local_tasks:
    - T001
    - T002
    - T007
    - T008
    bugs: []
    status: planned
  FR-009:
    text: Sin grupo de gestión de usuarios configurado, el sistema MUST mantener las reglas actuales de Dokploy
      sin ningún cambio.
    tasks:
    - MIL-441
    - MIL-452
    local_tasks:
    - T003
    - T004
    - T023
    - T024
    - T025
    bugs: []
    status: planned
  FR-010:
    text: El owner MUST poder gestionar usuarios siempre, con independencia de sus grupos.
    tasks:
    - MIL-441
    - MIL-451
    local_tasks:
    - T003
    - T004
    - T021
    - T022
    bugs: []
    status: planned
  FR-011:
    text: 'La restricción MUST NOT ampliar ningún permiso respecto a upstream: una acción que Dokploy rechaza hoy
      (por ejemplo, que un admin cambie el rol de otro admin por la interfaz) MUST seguir rechazándose también para
      quien pertenece al grupo de gestión.'
    tasks:
    - MIL-451
    local_tasks:
    - T021
    - T022
    bugs: []
    status: planned
  FR-012:
    text: El sistema MUST registrar en los eventos del SSO (los que el owner ya consulta en la pantalla de SSO)
      cada intento rechazado de gestión de usuarios, con quién lo intentó, la acción y el usuario afectado cuando
      la petición lo identifica (un id de usuario, un id de miembro o el email de un usuario existente). En invitaciones
      nuevas y en definiciones de roles no hay usuario afectado.
    tasks:
    - MIL-440
    - MIL-444
    - MIL-450
    - MIL-454
