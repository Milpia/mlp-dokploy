requirements:
  FR-001:
    text: El owner MUST poder configurar un grupo de gestión de usuarios del proveedor de identidad, desde la pantalla
      de SSO o por variable de entorno, con la misma precedencia que el resto de ajustes del SSO (el valor del entorno
      manda y aparece bloqueado).
    tasks:
    - MIL-440
    - MIL-442
    - MIL-452
    - MIL-454
    local_tasks:
    - T001
    - T002
    - T005
    - T006
    - T023
    - T024
    - T025
    - T027
    bugs: []
    status: planned
  FR-002:
    text: El grupo de gestión de usuarios MUST admitir una lista separada por comas; basta con pertenecer a uno
      de los grupos.
    tasks:
    - MIL-441
    - MIL-442
    - MIL-452
    local_tasks:
    - T003
    - T004
    - T005
    - T006
    - T023
    - T024
    - T025
    bugs: []
    status: planned
  FR-003:
    text: 'Cuando el grupo de gestión de usuarios está configurado, el sistema MUST permitir gestionar usuarios
      solo al owner y a los admins cuyo último login por SSO mostró que pertenecen a ese grupo. El grupo funciona
      como lista de permitidos: si falta la información de grupos o el grupo no coincide, el sistema MUST negar
      la gestión.'
    tasks:
    - MIL-441
    - MIL-451
    local_tasks:
    - T003
    - T004
    - T021
    - T022
    bugs: []
    status: planned
  FR-004:
    text: 'Gestionar usuarios comprende: borrar un usuario o quitarlo de la organización, invitar a un usuario,
      crear un usuario con credenciales, reenviar o cancelar una invitación, cambiar el rol de un miembro, cambiar
      los permisos de un miembro y crear, modificar o borrar definiciones de roles. La restricción MUST cubrir todas
      las vías por las que el servidor permite esas acciones, no solo las que usa la interfaz.'
    tasks:
    - MIL-440
    - MIL-444
    - MIL-445
    - MIL-446
    - MIL-447
    - MIL-450
    local_tasks:
    - T001
    - T002
    - T009
