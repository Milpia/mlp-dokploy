    verified_by:
    - MIL-456
  SC-003:
    text: Los admins del grupo de gestión y el owner completan el 100 % de las acciones de gestión que hoy pueden
      hacer.
    verified_by:
    - MIL-456
  SC-004:
    text: 'Una instancia que actualiza sin configurar el grupo no cambia de comportamiento: las pruebas actuales
      de gestión de usuarios pasan sin modificarse.'
    verified_by:
    - MIL-456
  SC-005:
    text: Un cambio de grupo en el proveedor de identidad se refleja en el permiso de gestión en el siguiente login
      del usuario y, como mucho, 8 horas después de su último login por SSO.
    verified_by:
    - MIL-456
