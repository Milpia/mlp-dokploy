    bugs: []
    status: planned
  FR-013:
    text: La funcionalidad MUST NOT depender de roles personalizados ni de ningún código bajo licencia enterprise.
    tasks:
    - MIL-455
    - MIL-456
    local_tasks:
    - T028
    - T029
    - T030
    bugs: []
    status: planned
  FR-014:
    text: Cuando el grupo de gestión de usuarios está configurado, un admin que nunca ha entrado por SSO MUST NOT
      poder gestionar usuarios hasta que un login por SSO confirme que pertenece al grupo. El owner queda exento
      (FR-010).
