    bugs: []
    status: planned
  FR-015:
    text: El permiso de gestión de usuarios de un admin MUST caducar 8 horas después de su último login por SSO.
      Pasado ese plazo, el sistema MUST rechazar las acciones de gestión con un mensaje que pida volver a iniciar
      sesión por SSO, sin cerrar la sesión ni afectar al resto de capacidades. El owner queda exento (FR-010).
    tasks:
    - MIL-441
