    - T012
    - T013
    - T014
    - T015
    - T016
    - T017
    - T020
    bugs: []
    status: planned
  FR-005:
    text: Un admin sin permiso de gestión de usuarios MUST conservar el resto de capacidades del rol admin.
    tasks:
    - MIL-445
    local_tasks:
    - T013
    - T016
    bugs: []
    status: planned
  FR-006:
    text: El sistema MUST rechazar en el servidor toda acción de gestión de usuarios de quien no tiene el permiso,
      aunque la petición no venga de la interfaz, con un error de falta de permisos y sin cambiar nada.
    tasks:
    - MIL-444
    - MIL-445
    - MIL-447
    - MIL-450
    local_tasks:
    - T009
    - T010
    - T011
    - T012
    - T013
