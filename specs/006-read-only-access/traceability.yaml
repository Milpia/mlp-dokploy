    - T022
    - T027
    bugs: []
    status: implemented
  FR-006:
    text: En un servicio de un entorno de solo lectura, el sistema MUST mostrar los **nombres** de las variables de entorno
      (del servicio, del entorno y del proyecto) y MUST NOT devolver sus **valores**, por ninguna vía. Lo mismo aplica
      a cualquier otro campo secreto de la configuración del servicio (contraseñas de bases de datos, tokens) al contenido
      de los archivos montados, de los que se muestran la ruta y el tipo, y al contenido del compose y a los comandos
      personalizados, de los que se muestran el tipo de build, la rama, el repositorio y la ruta del Dockerfile.
    tasks:
    - MIL-557
    - MIL-568
    local_tasks:
    - T018
    - T019
    - T020
    - T039
    bugs: []
    status: implemented
  FR-006a:
    text: En un servicio de un entorno de solo lectura, el sistema MUST mostrar la lista de backups y su estado (fecha,
      resultado, tamaño) y MUST rechazar descargarlos o leer su contenido, por ninguna vía.
    tasks:
    - MIL-557
    local_tasks:
    - T018
    - T019
    - T020
    bugs: []
    status: implemented
  FR-007:
    text: 'Si una persona está en un grupo que da acceso completo a un entorno y en otro que lo da en solo lectura, gana
      el **acceso completo**: los grupos suman, como en la spec 005 (FR-006 de la 005). Un entorno es de solo lectura
      para el usuario solo si ninguno de sus grupos le da acceso completo a él.'
    tasks:
    - MIL-550
    - MIL-560
    local_tasks:
    - T005
    - T006
    - T024
    - T025
    - T026
    bugs: []
    status: implemented
  FR-008:
    text: La solo lectura MUST recalcularse en cada login por SSO y caducar con el perfil a las 8 horas, como el resto
      de la spec 005.
