requirements:
  FR-001:
    text: 'El owner MUST poder marcar, en el perfil de un grupo de la spec 005, qué entornos de su alcance son de **solo
      lectura**: todos los del grupo o una lista por nombre. El resto de entornos del alcance tiene acceso completo,
      como en la 005.'
    tasks:
    - MIL-548
    - MIL-549
    - MIL-550
    - MIL-568
    local_tasks:
    - T001
    - T002
    - T003
    - T004
    - T005
    - T006
    - T039
    bugs: []
    status: implemented
  FR-002:
    text: En un servicio de un entorno de solo lectura, el sistema MUST permitir ver el proyecto, el entorno, el servicio,
      su estado, su configuración no secreta, sus logs, su monitorización y su historial de despliegues.
    tasks:
    - MIL-557
    local_tasks:
    - T018
    - T019
    - T020
    bugs: []
    status: implemented
  FR-003:
    text: 'En un servicio de un entorno de solo lectura, el sistema MUST rechazar: desplegar, volver a desplegar, cancelar
      un despliegue, arrancar, parar o reiniciar; crear, cambiar o borrar variables de entorno, dominios, volúmenes,
      backups, restores y tareas programadas; y cualquier otra acción que cambie el servicio o su configuración.'
    tasks:
    - MIL-554
    - MIL-555
    - MIL-556
    local_tasks:
    - T011
    - T012
    - T013
    - T014
    - T015
    - T016
    - T017
    bugs: []
    status: implemented
  FR-003a:
    text: Si un proyecto contiene algún entorno de solo lectura para el usuario, el sistema MUST rechazar que cambie
      las variables de entorno compartidas del proyecto, que borre el proyecto o que lo duplique, y MUST aplicar FR-006
      a esas variables. Como el nombre y la descripción del proyecto se guardan en la misma operación que sus variables,
      también quedan de solo lectura para ese usuario.
    tasks:
    - MIL-554
    - MIL-560
    local_tasks:
    - T011
    - T012
    - T024
    - T025
    - T026
    bugs: []
    status: implemented
  FR-004:
    text: En un servicio de un entorno de solo lectura, el sistema MUST rechazar abrir la terminal de sus contenedores.
      Ver sus logs y estadísticas MUST seguir permitido.
    tasks:
    - MIL-558
    local_tasks:
    - T021
    - T022
    bugs: []
    status: implemented
  FR-004a:
    text: A un usuario con algún entorno de solo lectura, el sistema MUST rechazarle abrir la terminal de un servidor
      y las acciones de Docker que actúan sobre el servidor y no sobre un servicio concreto (contenedores, volúmenes,
      imágenes y redes), porque no se pueden limitar a un entorno.
    tasks:
    - MIL-554
    - MIL-563
    local_tasks:
    - T011
    - T012
    - T030
    bugs: []
    status: implemented
  FR-004b:
    text: Al abrir la terminal o los logs de un contenedor, el sistema MUST comprobar, para todo member con perfil de
      grupo (tenga o no entornos de solo lectura), que el contenedor pertenece al servicio por el que se pide, y MUST
      rechazar la conexión si no pertenece o si no se puede comprobar. A los members sin perfil no se les aplica (FR-009).
    tasks:
    - MIL-558
    - MIL-564
    local_tasks:
    - T021
    - T022
    - T031
    - T032
    bugs: []
    status: implemented
  FR-004c:
    text: Antes de enviar en directo el log de un despliegue a un member con perfil de grupo, el sistema MUST comprobar
      que el despliegue pertenece a un servicio de su alcance y que su perfil no ha caducado (FR-008), y MUST rechazar
      la conexión si no se cumple o si no se puede comprobar. Ver ese log sigue siendo lectura, también en entornos de
      solo lectura (FR-002).
    tasks:
    - MIL-562
    - MIL-564
    local_tasks:
    - T028
    - T029
    - T031
    - T032
    bugs: []
    status: implemented
  FR-005:
    text: 'Las restricciones de FR-003, FR-003a, FR-004, FR-004a, FR-004b y FR-004c MUST cumplirse en el servidor por
      todas las vías (la interfaz, llamadas directas, claves de API y conexiones WebSocket), con fallo cerrado: un error
      al comprobarlas deniega la acción.'
    tasks:
    - MIL-554
    - MIL-555
    - MIL-556
    - MIL-558
    - MIL-561
    local_tasks:
    - T011
