  NFR-PERF-001:
    text: Comprobar la solo lectura MUST añadir como máximo 5 ms (p95) a cada acción de cambio de un member con perfil.
      MUST NOT añadir consultas a las peticiones de lectura tRPC, salvo una carga única del alcance de solo lectura por
      usuario tras un reinicio del proceso, ni añadir nada a las peticiones del owner, de los admins o de los members
      sin perfil. Al abrir una conexión WebSocket de un member con perfil (FR-004b, FR-004c), la comprobación MUST costar
      como máximo una consulta de ≤ 5 ms (p95) o una inspección del contenedor con un tiempo máximo de 5 s, una sola
      vez por conexión y nunca por mensaje.
    tasks:
    - MIL-567
    local_tasks:
