requirements:
  FR-001:
    text: El sistema MUST admitir un único origen de emergencia configurable solo por variable de entorno, sin ajuste
      en la interfaz.
    tasks:
    - MIL-459
    - MIL-466
    - MIL-468
    local_tasks:
    - T002
    - T003
    - T014
    - T015
    - T017
    bugs: []
    status: implemented
  FR-002:
    text: El valor MUST ser un origen exacto (esquema `http` o `https`, host y puerto opcional), sin ruta, consulta
      ni comodines. Un valor que no cumpla MUST ignorarse y registrarse como error de configuración.
    tasks:
    - MIL-459
    - MIL-468
    local_tasks:
    - T002
    - T003
    - T017
    bugs: []
    status: implemented
  FR-003:
    text: Sin origen de emergencia definido, la lista de orígenes de confianza MUST ser idéntica a la de upstream.
    tasks:
    - MIL-460
    - MIL-466
    local_tasks:
    - T004
    - T005
    - T014
    - T015
    bugs: []
    status: implemented
  FR-004:
    text: 'El sistema MUST aceptar el origen de emergencia solo cuando se cumplen a la vez tres condiciones: el
      modo SSO-only está activo, la petición es el login con email y contraseña, y el email es el del owner. Salvo
      en los casos de FR-005 y FR-009, MUST NOT aceptarlo en ninguna otra petición.'
    tasks:
    - MIL-460
    - MIL-462
    - MIL-463
    - MIL-465
    local_tasks:
    - T004
    - T005
    - T007
    - T008
    - T009
    - T012
    - T013
    bugs: []
    status: implemented
  FR-005:
    text: 'Con el modo SSO-only activo, el sistema MUST aceptar también el origen de emergencia en la verificación
      del segundo factor que sigue a un login de emergencia del owner: el código TOTP y el código de respaldo. MUST
      NOT aceptarlo en el resto de rutas del segundo factor (activarlo, desactivarlo, generar códigos).'
    tasks:
    - MIL-460
    - MIL-462
    - MIL-463
    local_tasks:
    - T004
    - T005
    - T007
    - T008
    - T009
    bugs: []
    status: implemented
  FR-006:
    text: Los usuarios que no son el owner MUST seguir siendo rechazados en la ruta de emergencia como hoy (spec
      001, FR-012), vengan del origen que vengan.
    tasks:
    - MIL-460
    - MIL-465
    local_tasks:
    - T004
    - T005
    - T012
    - T013
    bugs: []
    status: implemented
  FR-007:
    text: El sistema MUST registrar cada intento de login de emergencia hecho desde el origen de emergencia, correcto
      o fallido, con el email, la IP, el resultado y una marca que indique que llegó por el origen de emergencia.
    tasks:
    - MIL-458
    - MIL-461
    - MIL-464
    - MIL-465
    local_tasks:
    - T001
    - T006
    - T010
    - T011
    - T012
    - T013
    bugs: []
    status: implemented
  FR-008:
    text: La funcionalidad MUST NOT depender de ningún código bajo licencia enterprise.
    tasks:
    - MIL-469
    - MIL-470
    local_tasks:
    - T018
    - T019
    - T020
    bugs: []
    status: in_progress
  FR-009:
    text: Con el modo SSO-only activo, el sistema MUST aceptar también el origen de emergencia en el cierre de sesión,
      para que el owner termine la sesión de emergencia desde el mismo navegador.
    tasks:
    - MIL-460
    - MIL-462
    - MIL-463
    local_tasks:
    - T004
    - T005
    - T007
    - T008
    - T009
    bugs: []
    status: implemented
  NFR-PERF-001:
    text: Sin origen de emergencia definido, la funcionalidad MUST NOT añadir consultas ni más de 1 ms (p95) a ninguna
      petición.
    tasks:
    - MIL-467
    local_tasks:
    - T016
    bugs: []
    status: implemented
  NFR-PERF-002:
    text: Con el origen definido, las peticiones que no sean de login MUST NOT tener ninguna consulta añadida.
    tasks:
    - MIL-467
    local_tasks:
    - T016
    bugs: []
    status: implemented
  NFR-SEC-001:
    text: El origen de emergencia MUST añadirse solo a la lista de orígenes de la petición en curso, sin modificar
      ninguna lista compartida entre peticiones.
    tasks:
    - MIL-462
    - MIL-469
    local_tasks:
    - T007
    - T009
    - T019
    bugs: []
    status: implemented
  NFR-SEC-002:
    text: Ante cualquier error al comprobar las condiciones de FR-004 (configuración ilegible, owner no encontrado),
      el sistema MUST NOT añadir el origen.
    tasks:
    - MIL-460
    - MIL-462
    - MIL-469
    local_tasks:
    - T004
    - T005
    - T007
    - T009
    - T019
    bugs: []
    status: implemented
