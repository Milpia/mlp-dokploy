requirements:
  FR-001:
    text: El módulo MUST quedar verificado con Keycloak, Okta, Auth0, Authentik, Zitadel, FusionAuth y Authelia.
      «Verificado» significa que ese proveedor pasa todos los escenarios de FR-004 contra una instancia real en
      la versión que registra la matriz (FR-010).
    tasks:
    - MIL-479
    - MIL-480
    - MIL-482
    - MIL-488
    - MIL-489
    - MIL-490
    - MIL-492
    bugs: []
    status: in_progress
    local_tasks:
    - T010
    - T011
    - T012
    - T014
    - T015
    - T023
    - T024
    - T025
    - T027
    - T028
  FR-002:
    text: 'La guía de operación MUST incluir una sección por proveedor con estos pasos:'
    tasks:
    - MIL-480
    - MIL-482
    - MIL-492
    bugs: []
    status: implemented
    local_tasks:
    - T012
    - T014
    - T015
    - T027
    - T028
  FR-003:
    text: Los presets de la pantalla de SSO (spec 001, FR-024) MUST incluir también Auth0 y FusionAuth.
    tasks:
    - MIL-487
    bugs: []
    status: implemented
    local_tasks:
    - T022
  FR-004:
    text: 'Cada proveedor MUST verificarse con la misma batería de escenarios, que son los de US1:'
    tasks:
    - MIL-476
    - MIL-477
    - MIL-479
    bugs: []
    status: implemented
    local_tasks:
    - T003
    - T004
    - T005
    - T006
    - T007
    - T010
    - T011
  FR-005:
    text: Cuando el token de identidad no incluye el claim de grupos o la verificación del email, el sistema MUST
      obtenerlos de la información de usuario del proveedor. Si están en los dos sitios, MUST prevalecer el token
      de identidad. La información de usuario MUST descartarse, y el login denegarse, si su `sub` no coincide con
      el del token de identidad (OpenID Connect Core §5.3.2).
    tasks:
    - MIL-486
    - MIL-490
    - MIL-493
    bugs: []
    status: implemented
    local_tasks:
    - T020
    - T021
    - T025
    - T029
    - T032
  FR-006:
    text: El nombre del claim de grupos MUST admitir cualquier texto, incluidos nombres con forma de URL, puntos,
      barras y dos puntos, y el sistema MUST tratarlo como un nombre literal, sin interpretarlo como ruta.
    tasks:
    - MIL-486
    bugs: []
    status: implemented
    local_tasks:
    - T020
    - T021
    - T032
  FR-007:
    text: Las diferencias entre proveedores MUST resolverse con configuración o con reglas genéricas de OIDC, nunca
      con código dedicado a un proveedor concreto. Si una diferencia no se puede resolver así, MUST documentarse
      como limitación en la matriz.
    tasks:
    - MIL-488
    - MIL-492
    bugs: []
    status: implemented
    local_tasks:
    - T023
    - T027
    - T028
  FR-008:
    text: 'Las verificaciones de Okta y Auth0 MUST ser opt-in:'
    tasks:
    - MIL-475
    - MIL-476
    - MIL-478
    - MIL-481
    - MIL-491
    - MIL-493
    bugs: []
    status: implemented
    local_tasks:
    - T001
    - T002
    - T003
    - T004
    - T005
    - T008
    - T009
    - T013
    - T026
    - T029
  FR-009:
    text: 'Las verificaciones de los proveedores autoalojables MUST usar instancias efímeras:'
    tasks:
    - MIL-475
    - MIL-478
    bugs: []
    status: implemented
    local_tasks:
    - T001
    - T002
    - T008
    - T009
  FR-010:
    text: 'MUST existir una matriz de compatibilidad junto a la guía de operación. Por proveedor recoge:'
    tasks:
    - MIL-483
    - MIL-485
    bugs: []
    status: implemented
    local_tasks:
    - T016
    - T017
    - T019
  FR-011:
    text: La prueba de conexión MUST clasificar las respuestas de cada proveedor de forma que un secreto incorrecto
      nunca se informe como conexión correcta.
    tasks:
    - MIL-477
    - MIL-489
    bugs: []
    status: implemented
    local_tasks:
    - T006
    - T007
    - T024
  FR-012:
    text: La spec 001 MUST remitir a esta spec para la lista de proveedores verificados, sin cambiar su propio alcance.
    tasks:
    - MIL-485
    bugs: []
    status: implemented
    local_tasks:
    - T019
  FR-013:
    text: La funcionalidad MUST NOT depender de ningún código bajo licencia enterprise.
    tasks:
    - MIL-475
    bugs: []
    status: implemented
    local_tasks:
    - T001
    - T002
  FR-014:
    text: Cada verificación MUST guardar sus resultados en un archivo versionado con proveedor, versión, fecha y
      resultado por escenario. La tabla de la matriz MUST generarse desde esos archivos con un comando, sin editarse
      a mano. Las limitaciones conocidas son la única parte que se escribe a mano.
    tasks:
    - MIL-476
    - MIL-483
    bugs: []
    status: implemented
    local_tasks:
    - T003
    - T004
    - T005
    - T016
    - T017
  NFR-QA-001:
    text: La verificación de un proveedor autoalojable, con el arranque de su instancia efímera incluido, MUST terminar
      en menos de 10 minutos.
    tasks:
    - MIL-478
    bugs: []
    status: implemented
    local_tasks:
    - T008
    - T009
  NFR-QA-002:
    text: Las verificaciones MUST NOT formar parte de la suite por defecto (`pnpm test`). Se lanzan de forma explícita,
      por proveedor o todas a la vez.
    tasks:
    - MIL-477
    bugs: []
    status: implemented
    local_tasks:
    - T006
    - T007
  NFR-QA-003:
    text: Las verificaciones de los cinco autoalojables MUST ejecutarse en CI una vez por semana y a demanda, y
      un fallo MUST quedar visible para el equipo. Okta y Auth0 MUST NOT ejecutarse en CI, porque sus credenciales
      no se guardan en GitHub.
    tasks:
    - MIL-484
    bugs: []
    status: implemented
    local_tasks:
    - T018
  NFR-SEC-001:
    text: Los tenants de prueba de Okta y Auth0 MUST dedicarse solo a pruebas, sin usuarios ni datos reales, y sus
      credenciales MUST poder revocarse sin afectar a ningún entorno de Milpia.
    tasks:
    - MIL-481
    - MIL-491
    bugs: []
    status: implemented
    local_tasks:
    - T013
    - T026
  NFR-PERF-001:
    text: Leer la información de usuario (FR-005) MUST hacerse solo cuando falten datos en el token, con el mismo
      tiempo máximo de espera que el resto de llamadas al proveedor. MUST NOT añadir llamadas en los logins cuyo
      token ya trae los grupos.
    tasks:
    - MIL-486
    bugs: []
    status: implemented
    local_tasks:
    - T020
    - T021
    - T032
success_criteria:
  SC-001:
    text: Los 7 proveedores pasan los escenarios de FR-004, o tienen cada limitación documentada en la matriz con
      su motivo.
    verified_by:
    - MIL-482
    - MIL-492
  SC-002:
    text: Un operador que no conoce el módulo configura cualquiera de los 7 proveedores solo con la guía en menos
      de 30 minutos, hasta que un usuario del grupo de acceso entra.
    verified_by:
    - MIL-494
  SC-003:
    text: Cualquier verificación de un proveedor autoalojable se repite con un solo comando y termina en menos de
      10 minutos.
    verified_by:
    - MIL-494
  SC-004:
    text: En ninguna ejecución de verificación la prueba de conexión da por buena una conexión con secreto incorrecto.
    verified_by:
    - MIL-477
  SC-005:
    text: Sin credenciales de los tenants SaaS, lanzar todas las verificaciones completa las de los 5 autoalojables
      e informa de las 2 omitidas.
    verified_by:
    - MIL-478
    - MIL-494
  SC-006:
    text: Ningún cambio de esta spec introduce código que nombre a un proveedor concreto fuera de presets, documentación
      y pruebas.
    verified_by:
    - MIL-494
