# Ephemeral Zitadel for the spec 004 battery. Test values only (see ../README.md).
# OIDC_E2E_ZITADEL_DIR receives the admin PAT and the seeded client credentials.
services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.19.0
    command: start-from-init --masterkey "DokployE2eMasterkeyOf32Chars0123" --tlsMode disabled
    user: "0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8081
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: e2e-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: e2e-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /run-files/admin.pat
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ${OIDC_E2E_ZITADEL_DIR:?run through the e2e:oidc runner}:/run-files
